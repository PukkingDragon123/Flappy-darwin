<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c1512">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Canopy Rangers — Amazon Wildlife Hunter</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #05080a;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    background-image: radial-gradient(ellipse at 50% 35%, #0c1512 0%, #05080a 72%);
  }
  #wrap { position: relative; line-height: 0; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background: #000;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="320" height="180"></canvas></div>
  <script src="js/font.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/hunter.js"></script>
</body>
</html>
