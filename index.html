<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Canopy Rangers — Amazon Wildlife Hunter</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #05080a;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    cursor: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: radial-gradient(ellipse at 50% 35%, #0c1512 0%, #05080a 72%);
  }
  #wrap { position: relative; line-height: 0; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background: #000;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="320" height="180"></canvas></div>
  <script src="js/font.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/hunter.js"></script>
</body>
</html>
